<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin  -  GYM ZOON</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>

    <main class="login-card">
        <!-- اسم المتجر / الشعار -->
            <header class="brand-header">
            <a href="index.html"> <h1 class="brand-title">GYM ZOON </h1></a>
        </header>

        <!-- عنوان الصفحة -->
        <section class="auth-content">
            <h2 class="auth-heading">تسجيل الدخول</h2>
            <p class="auth-subtext">اختر طريقة تسجيل الدخول للمتابعة إلى حسابك</p>
        </section>

        <!-- زر Connect with Shop -->
        <div class="shop-pay-wrapper">
            <button class="btn-shop-pay" type="button">
                <span>Connect with Shop</span>
                <svg class="shop-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                    <path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm0 10c-2.76 0-5-2.24-5-5h2c0 1.66 1.34 3 3 3s3-1.34 3-3h2c0 2.76-2.24 5-5 5z"/>
                </svg>
            </button>
        </div>

        <div class="divider">
            <span>أو</span>
        </div>

        <!-- زر تسجيل الدخول باستخدام جوجل (مكان اللينك فاضي زي ما طلبت) -->
        <div class="google-login-wrapper">
            <a href="" class="btn-google-sign">
                <!-- أيقونة جوجل الرسمية -->
                <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                <span>المتابعة باستخدام Google</span>
            </a>
        </div>

        <!-- شروط الخدمة والسياسات -->
        <footer class="auth-footer">
            <p class="footer-text">
                بالاستمرار، فإنك توافق على <a href="#" class="footer-link">شروط الخدمة</a> و <a href="#" class="footer-link">سياسة الخصوصية</a>.
            </p>
        </footer>
    </main>

</body>
</html>
